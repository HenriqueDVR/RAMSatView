name: ingest

# Hourly rebuild of conditions.json.
#
# Fail-closed by design: if any step fails, the job exits non-zero and the
# previously published file stays in place. A stale file that the web app
# badges as stale is strictly better than a fresh-looking file built from
# partial data.

on:
  schedule:
    # Every hour at :10, past the top of the hour so upstream model runs have
    # landed. UTC - Madeira is UTC+0 in winter, UTC+1 in summer.
    - cron: "10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "ingest/**"
      - "data/spots.yaml"
      - ".github/workflows/ingest.yml"

concurrency:
  # Never let two runs race to publish. Do not cancel in progress: a half-done
  # upload is the one state we cannot recover from.
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Offline only - the suite must never depend on a live upstream API,
        # or an Open-Meteo outage silently becomes a red build.
        run: python -m pytest -q

      - name: Build conditions.json
        run: python -m ingest.build --out dist/conditions.json

      - name: Report output size
        run: |
          ls -lh dist/
          python -c "import json;d=json.load(open('dist/conditions.json'));print(len(d['spots']),'spots,',d['generated_at'])"

      - name: Upload to Cloudflare R2
        # Skipped on forks and on PRs, where secrets are unavailable.
        if: github.event_name != 'pull_request' && vars.R2_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # The volume goes up first: conditions.json is what points at it, so
          # publishing the pointer first would leave a window where the map
          # fetches a file that is not there yet.
          if [ -f dist/cloud-grid.bin ]; then
            aws s3 cp dist/cloud-grid.bin "s3://${R2_BUCKET}/cloud-grid.bin" \
              --endpoint-url "${R2_ENDPOINT}" \
              --content-type application/octet-stream \
              --cache-control "public, max-age=300, stale-while-revalidate=3600"
          fi
          aws s3 cp dist/conditions.json "s3://${R2_BUCKET}/conditions.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/json \
            --cache-control "public, max-age=300, stale-while-revalidate=3600"

      - name: Keep the build output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conditions
          path: |
            dist/conditions.json
            dist/cloud-grid.bin
          retention-days: 7
          if-no-files-found: warn
